.big{

.muted{

.small{

.secondary{

}

.red{

}

.gold{

.case:hover{

.secret{

.timer{

.item strong{

.found{

}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:15px;
    z-index:100;
    backdrop-filter:blur(5px);
}

.modal.hidden{
    display:none;
}

.modalBox{
    position:relative;
    width:min(600px,100%);
    max-height:90vh;
    overflow:auto;
    background:#111827;
    border:1px solid #34415e;
    border-radius:20px;
    padding:24px 20px 20px;
    box-shadow:0 25px 80px rgba(0,0,0,.6);
    animation:modalIn .18s ease;
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:translateY(15px) scale(.97);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.close{
    position:absolute;
    right:12px;
    top:10px;
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:#202a3e;
    color:#fff;
    font-size:23px;
    line-height:38px;
    cursor:pointer;
}

.close:hover{

}

.modalTitle{

}

.modalButtons{

@media(max-width:600px){

function loadState(){

    try{

            return Object.assign(
                defaultState(),
                JSON.parse(saved)
            );

        }

    }catch(e){

        console.log(e);

    }

    return defaultState();

}

const allCases=cases.concat(secretCases);


/* =====================================

===================================== */

let currentCase=0;

let currentTab="clues";

let timerInterval=null;


/* =====================================
   СЛУЖЕБНЫЕ ФУНКЦИИ
===================================== */

function esc(text){

    return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");

}


function getClues(id){

    if(!state.clues[id]){
        state.clues[id]=[];
    }

    return state.clues[id];

}


function getQuestions(id){

    if(!state.questions[id]){
        state.questions[id]=[];
    }

    return state.questions[id];

}


function isSecret(id){

    return id>20;

}


function isUnlocked(id){

    if(isSecret(id)){

        return state.solved.filter(
            x=>x<=20
        ).length===20;

    }

    return id<=state.unlocked;

}


function getLimit(id){

    if(isSecret(id))return 90;

    if(id<=5)return 180;

    if(id<=10)return 150;

    if(id<=15)return 120;

    return 105;

}


function getTime(id){

    if(!state.timers[id]){

        state.timers[id]={
            end:Date.now()+getLimit(id)*1000
        };

        save();

    }

    return Math.max(
        0,
        Math.floor(
            (state.timers[id].end-Date.now())/1000
        )
    );

}


function formatTime(seconds){

    let minutes=Math.floor(seconds/60);

    let sec=seconds%60;

    return String(minutes).padStart(2,"0")
    +":"
    +String(sec).padStart(2,"0");

}


/* =====================================
   МОДАЛЬНОЕ ОКНО
===================================== */

function showModal(title,content){

    let modal=document.getElementById("modal");

    if(!modal)return;

    modal.innerHTML=`

        <div class="modalBox">

            <button
            class="close"
            onclick="closeModal()"
            aria-label="Закрыть">

                ×

            </button>

            <h2 class="modalTitle">
                ${title}
            </h2>

            ${content}

        </div>

    `;

    modal.classList.remove("hidden");

}


function closeModal(){

    let modal=document.getElementById("modal");

    if(modal){

        modal.classList.add("hidden");

    }

}


/* =====================================
   ГЛАВНОЕ МЕНЮ
===================================== */

    clearInterval(timerInterval);

    currentCase=0;

    renderHome();

}

function continueGame(){

    let id=state.unlocked;

    if(id>20){
        id=20;
    }

    openCase(id);

}


function lockedMessage(){

    showModal(

        "🔒 Дело закрыто",

        `

        <p>
            Это расследование пока недоступно.
        </p>

        <p class="muted">
            Раскрой предыдущие дела,

        </p>

                Понятно

            </button>

        </div>

        `

    );

}


/* =====================================
   ОТКРЫТИЕ ДЕЛА
===================================== */

function openCase(id){

    if(!isUnlocked(id)){

        lockedMessage();

        return;

    }


    currentCase=id;

    currentTab="clues";

    getClues(id);

    getQuestions(id);

    getTime(id);

    save();

    renderCase();

    startTimer();

}


function startTimer(){

    clearInterval(timerInterval);

    timerInterval=setInterval(()=>{

        let time=getTime(currentCase);

        let timer=document.getElementById("timer");


        if(timer){

            timer.textContent=
                formatTime(time);


            if(time<=20){

                timer.classList.add(
                    "dangerTimer"
                );

            }else{

                timer.classList.remove(
                    "dangerTimer"
                );

            }

        }


        if(time<=0){

            clearInterval(timerInterval);

            timeout();

        }

    },500);

}


function timeout(){

    showModal(

        "⏰ Время вышло",

        `

        <p>
            Время расследования закончилось.
        </p>

        <p class="muted">
            Ты можешь начать это дело заново.
        </p>

        <div class="modalButtons">

            <button
            class="btn"
            onclick="
            closeModal();
            openCase(${currentCase});
            ">

                🔄 Начать заново

            </button>


            <button
            class="btn secondary"
            onclick="
            closeModal();
            home();
            ">

                ← К списку дел

            </button>

        </div>

        `

    );

}


/* =====================================
   ЭКРАН ДЕЛА
===================================== */

function renderCase(){

    let c=allCases[currentCase];

    let clues=getClues(currentCase);

    let questions=getQuestions(currentCase);

    let content="";


    if(currentTab==="clues"){

        content=c.clues.map(
            (clue,index)=>{

                let found=
                    clues.includes(index);


                return `

                <div
                class="item ${found?"found":""}">

                    <strong>

                        ${
                            found
                            ?"🔎 Улика найдена"
                            :"❓ Неизвестная улика"
                        }

                    </strong>


                    <p>

                        ${
                            found
                            ?esc(clue)
                            :"Нужно внимательно осмотреть место."
                        }

                    </p>


                    ${
                        found
                        ?""
                        :`
                        <button
                        class="btn secondary"
                        onclick="findClue(${index})">

                            🔍 Осмотреть

                        </button>
                        `
                    }

                </div>

                `;

            }
        ).join("");

    }


    if(currentTab==="people"){

        content=c.people.map(
            (person,index)=>{

                let asked=
                    questions.includes(index);


                return `

                <div class="item">

                    <strong>
                        👤 ${esc(person)}
                    </strong>

                    <p class="muted small">
                        Подозреваемый №${index+1}

                    <button
                    class="btn secondary"
                    onclick="question(${index})">

                        ${
                            asked
                            ?"🔁 Спросить ещё"
                            :"💬 Допросить"
                        }

                    </button>


                    <button
                    class="btn red"
                    onclick="accuse(${index})">

                        ⚖️ Обвинить

                    </button>

                </div>

                `;

            }
        ).join("");

    }


    if(currentTab==="journal"){

        content=`

        <div class="item">

            <strong>
                📓 Журнал расследования
            </strong>

            <p>
                Найдено улик:
                ${clues.length}/${c.clues.length}
            </p>

            <p>
                Допросов:
                ${questions.length}/3
            </p>

            <p>
                Осталось времени:
                ${formatTime(getTime(currentCase))}
            </p>

        </div>

        `;


        clues.forEach(index=>{

            content+=`

            <div class="item found">

                <strong>
                    🔎 Улика №${index+1}
                </strong>

                    ${esc(c.clues[index])}
                </p>

            `;

        });

    document.getElementById("app").innerHTML=`

            <button
            class="btn secondary"
            onclick="home()">

                ← Дела

            </button>


            <div
            id="timer"
            class="timer">

                ${formatTime(
                    getTime(currentCase)
                )}

            </div>

        </div>


        <div class="card">

            <div class="row">

                <span class="badge">

                    ${
                        isSecret(currentCase)
                        ?"🔐 СЕКРЕТНОЕ ДЕЛО"
                        :"📁 ДЕЛО №"+
                        String(currentCase).padStart(2,"0")
                    }

                </span>


                <span class="badge">

                    ${c.difficulty}

                </span>

            </div>


            <h1>
                ${esc(c.title)}
            </h1>


            <p class="muted">
                📍 ${esc(c.place)}
            </p>


            <p>
                ${esc(c.story)}
            </p>


            <div class="progress">

                <div
                style="
                width:${(
                    clues.length /
                    c.clues.length
                )*100}%;
                ">

                </div>

            </div>


            <p class="small muted">

                Улики:
                ${clues.length}/${c.clues.length}

                ·

                Допросов:
                ${questions.length}

            </p>

        </div>


        <div class="card">

            <div class="tabs">

                <button
                class="tab ${
                    currentTab==="clues"
                    ?"active":""
                }"
                onclick="
                changeTab('clues')
                ">

                    🔎 Улики

                </button>


                <button
                class="tab ${
                    currentTab==="people"
                    ?"active":""
                }"
                onclick="
                changeTab('people')
                ">

                    👥 Люди

                </button>


                <button
                class="tab ${
                    currentTab==="journal"
                    ?"active":""
                }"
                onclick="
                changeTab('journal')
                ">

                    📓 Журнал

                </button>

            </div>


            ${content}

        </div>


        <div class="card">

            <button
            class="btn gold"
            onclick="useHint()">

                💡 Подсказка

            </button>


            ${
                state.shop.time>0
                ?`
                <button
                class="btn secondary"
                onclick="useExtraTime()">

                    ⏱️ +30 сек
                    (${state.shop.time})

                </button>
                `
                :""
            }


            ${
                state.shop.life>0
                ?`
                <button
                class="btn secondary"
                onclick="useExtraLife()">

                    ❤️ Жизнь
                    (${state.shop.life})

                </button>
                `
                :""
            }

        </div>


        <div
        id="modal"
        class="modal hidden">
        </div>

    `;

}


function changeTab(tab){

    currentTab=tab;

    renderCase();

}


/* =====================================
   УЛИКИ
===================================== */

function findClue(index){

    let clues=getClues(currentCase);

    if(!clues.includes(index)){

        clues.push(index);

        state.points+=10;

        save();


        showModal(

            "🔎 Новая улика",

            `

            <p>
                Ты нашёл(ла) новую улику.
            </p>

            <div class="notice">

                ${esc(
                    allCases[currentCase].clues[index]
                )}

            </div>

            <div class="modalButtons">

                <button
                class="btn"
                onclick="
                closeModal();
                renderCase();
                ">

                    Добавить в журнал

                </button>

            </div>

            `

        );

    }

}


/* =====================================
   ДОПРОС
===================================== */

function question(index){

    let c=allCases[currentCase];

    let questions=
        getQuestions(currentCase);


    if(!questions.includes(index)){

        questions.push(index);

        state.points+=5;

        save();

    }


    showModal(

        "💬 Допрос",

        `

        <h3>
            ${esc(c.people[index])}
        </h3>

        <p class="muted">
            Ответ подозреваемого:
        </p>

        <div class="notice">

            «${esc(c.answers[index])}»

        </div>


        <div class="modalButtons">

            <button
            class="btn"
            onclick="
            closeModal();
            renderCase();
            ">

                Закрыть

            </button>

        </div>

        `

    );

}


/* =====================================
   ОБВИНЕНИЕ
===================================== */

function accuse(index){

    let c=allCases[currentCase];


    if(getTime(currentCase)<=0){

        timeout();

        return;

    }


    if(index===c.culprit){

        winCase();

        return;

    }


    state.lives--;

    state.points=Math.max(
        0,
        state.points-25
    );

    state.streak=0;

    save();


    if(state.lives<=0){

        state.lives=3;

        save();


        showModal(

            "❌ Расследование провалено",

            `

            <p>
                Ты использовал(а) все жизни.
            </p>

            <p class="muted">
                Попробуй снова и внимательнее
                сравнивай показания с уликами.
            </p>


            <div class="modalButtons">

                <button
                class="btn"
                onclick="
                closeModal();
                openCase(${currentCase});
                ">

                    🔄 Попробовать ещё

                </button>

            </div>

            `

        );

    }else{

        showModal(

            "❌ Неверное обвинение",

            `

            <p>
                Этот человек не является
                главным лжецом.
            </p>

            <p>
                Осталось жизней:
                ❤️ ${state.lives}
            </p>

            <div class="modalButtons">

                <button
                class="btn"
                onclick="closeModal()">

                    Продолжить

                </button>

            </div>

            `

        );

    }

}


/* =====================================
   ПОБЕДА
===================================== */

function winCase(){

    let c=allCases[currentCase];

    let clues=getClues(currentCase);

    let questions=getQuestions(currentCase);

    let used=
        getLimit(currentCase)-
        getTime(currentCase);


    let stars=1;


    if(
        clues.length>=2 &&
        questions.length>=2
    ){

        stars=2;

    }


    if(
        clues.length===c.clues.length &&
        questions.length>=3 &&
        used<getLimit(currentCase)*.75
    ){

        stars=3;

    }


    if(
        !state.solved.includes(currentCase)
    ){

        state.solved.push(currentCase);

    }


    state.stars[currentCase]=stars;


    state.points+=80+(stars*30);

    state.coins+=30+(stars*10);

    state.streak++;


    if(
        currentCase===state.unlocked &&
        currentCase<=20
    ){

        state.unlocked++;

    }


    delete state.timers[currentCase];

    save();

    clearInterval(timerInterval);


    showModal(

        "🎉 Дело раскрыто!",

        `

        <div class="stars">

            ${"⭐".repeat(stars)}
            ${"☆".repeat(3-stars)}

        </div>


        <p>

            Главный лжец:

            <b>
                ${esc(c.people[c.culprit])}
            </b>

        </p>


        <p class="muted">

            Ты правильно сопоставил(а)
            показания и объективные улики.

        </p>


        <p class="coins">

            +${30+(stars*10)} 🪙

        </p>


        <div class="modalButtons">

            <button
            class="btn"
            onclick="
            closeModal();
            home();
            ">

                📂 К списку дел

            </button>

        </div>

        `

    );

}


/* =====================================
   ПОДСКАЗКА
===================================== */

function useHint(){

    if(state.shop.hint>0){

        state.shop.hint--;

    }else{

        if(state.points<30){

            showModal(

                "💡 Подсказка недоступна",

                `

                <p>
                    Для обычной подсказки
                    нужно <b>30 очков</b>.
                </p>

                <p class="muted">
                    Или купи билет подсказки
                    в магазине.
                </p>

                `

            );

            return;

        }

        state.points-=30;

    }


    let c=allCases[currentCase];

    save();


    showModal(

        "💡 Подсказка",

        `

        <p>
            Обрати особое внимание
            на подозреваемого №${c.culprit+1}.
        </p>

        <div class="notice">

            Сравни его слова с фактами
            из раздела «Улики».

        </div>

        `

    );

}


function useExtraTime(){

    if(state.shop.time<=0)return;


    state.shop.time--;

    state.timers[currentCase].end+=30000;

    save();

    closeModal();

    renderCase();

}


function useExtraLife(){

    if(state.shop.life<=0)return;


    state.shop.life--;

    state.lives++;

    save();

    closeModal();

    renderCase();

}


/* =====================================
   МАГАЗИН
===================================== */

                    💡 Подсказка

                <p>
                    Один бесплатный
                    билет подсказки.
                </p>

                <button
                class="btn"
                onclick="buy('hint')">

                    40 🪙

                </button>

            </div>


            <div class="item">

                <h3>
                    ⏱️ Время

                <p>
                    +30 секунд.

                <button
                class="btn"

            </div>


            <div class="item">

                    ❤️ Жизнь
                </h3>

                </p>

                <button

function buy(type){

    const prices={
        hint:40,
        time:50,
        life:60
    };


    if(state.coins<prices[type]){

        showModal(

            "💰 Недостаточно монет",

            `

            <p>
                Для этой покупки нужно
                <b>${prices[type]} 🪙</b>.
            </p>

            <p class="muted">
                Твои монеты:
                ${state.coins} 🪙
            </p>

            `

        );

        return;

    }


    state.coins-=prices[type];

    state.shop[type]++;

    save();


    let names={
        hint:"💡 Билет подсказки",
        time:"⏱️ Дополнительное время",
        life:"❤️ Дополнительная жизнь"
    };


    showModal(

        "✅ Покупка совершена",

        `

        <p>
            Ты приобрёл(ла):
        </p>

        <h3>
            ${names[type]}
        </h3>

        <p class="coins">
            Осталось:
            ${state.coins} 🪙
        </p>

        `

    );

}

function rules(){

    showModal(

        "📖 Как играть",

        `

function confirmReset(){

    showModal(

        "🗑️ Сбросить прогресс?",

        `

        <p>
            Будут удалены:
        </p>

        <ul>

            <li>открытые дела;</li>
            <li>очки;</li>
            <li>монеты;</li>
            <li>звёзды;</li>
            <li>купленные предметы.</li>

        </ul>


        <p class="muted">
            Это действие нельзя отменить.
        </p>


        <div class="modalButtons">

            <button
            class="btn red"
            onclick="resetGame()">

                Да, сбросить

            </button>


            <button
            class="btn secondary"
            onclick="closeModal()">

                Отмена

            </button>

        </div>

        `

    );

}


function resetGame(){

    localStorage.removeItem(SAVE_KEY);

    location.reload();

}
